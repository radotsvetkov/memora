# cargo-deny configuration. Run locally with `cargo deny check`.
# Enforced in CI to keep the dependency tree free of known-vulnerable,
# yanked, or non-permissively-licensed crates.

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (RUSTSEC-2024-0436) but is only pulled in
  # transitively (fastembed -> tokenizers, rmcp, rav1e). It is a compile-time
  # proc-macro helper with no runtime/security impact and no upstream fix.
  "RUSTSEC-2024-0436",
  # `bincode` 1.3.3 is unmaintained by the maintainers' own decision
  # (RUSTSEC-2025-0141); they consider 1.3.3 feature-complete. Pulled
  # transitively (hnsw_rs). No vulnerability, no action needed.
  "RUSTSEC-2025-0141",
  # `rmcp` 0.1.5's Streamable HTTP server transport doesn't validate the `Host`
  # header, enabling DNS rebinding against a server bound to a loopback/private
  # interface (RUSTSEC-2026-0189, fixed >=1.4.0). Memora never uses that
  # transport: both memora-cli and memora-mcp depend on rmcp with only the
  # `transport-io` feature (stdio), which the advisory explicitly excludes.
  # Tracked for the next deliberate rmcp 0.1 -> 1.x migration (large API surface
  # change across ~15 releases), not a blind bump during a dependency sweep.
  "RUSTSEC-2026-0189",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Anything outside this list fails the check.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "0BSD",
  "NCSA",
  "CDLA-Permissive-2.0",
  # MPL-2.0 is file-level (weak) copyleft: fine to depend on without affecting
  # Memora's own license. Pulled by `dirs` (option-ext) and, under the `web`
  # feature, by the Servo CSS/selector crates behind `scraper`.
  "MPL-2.0",
]
# Narrowly-scoped exception for one transitive weak-copyleft crate.
exceptions = [
  # UEFI runtime crate, only compiled for UEFI targets (never our binaries).
  { allow = ["LGPL-2.1-or-later"], name = "r-efi" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

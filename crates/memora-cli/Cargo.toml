[package]
name = "memora-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Memora: catch your AI citing sources that don't say what it claims. Local verification layer for AI memory."
homepage = "https://radotsvetkov.github.io/memora"
keywords = ["llm", "rag", "hallucination", "citations", "memory"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.wix]
upgrade-guid = "6DC48B12-C94B-4D32-8C5A-44CA13245270"
path-guid = "6037C433-77D1-4F71-A98D-95AC2249AEC6"
license = false
eula = false

[package.metadata.dist]
dist = true

[features]
# PDF ingestion (`memora ingest file.pdf`). Off by default to keep the binary and
# supply chain lean; enable with `cargo install memora-cli --features pdf`.
pdf = ["dep:pdf-extract"]
# Web-page ingestion (`memora ingest <url>` or a `.html` file). Off by default;
# enable with `cargo install memora-cli --features web`.
web = ["dep:reqwest", "dep:scraper"]

[[bin]]
name = "memora"
path = "src/main.rs"

[[bin]]
name = "memora-mcp"
path = "src/bin/memora-mcp.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
async-trait.workspace = true
blake3.workspace = true
regex.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
toml.workspace = true
rusqlite.workspace = true
dirs.workspace = true
memora-core.workspace = true
memora-llm.workspace = true
memora-mcp.workspace = true
rmcp = { version = "0.1", features = ["transport-io"] }
tempfile.workspace = true
pdf-extract = { version = "0.7", optional = true }
reqwest = { workspace = true, optional = true }
scraper = { version = "0.20", optional = true }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
rusqlite.workspace = true

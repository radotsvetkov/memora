[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# NOTE: Homebrew is intentionally NOT wired into dist. The tap
# (radotsvetkov/homebrew-memora) is maintained MANUALLY (see RELEASING.md),
# because auto-publishing to a separate tap repo needs a cross-repo PAT we keep
# out of CI. This keeps every release green. To enable automatic Homebrew
# publishing later: add `"homebrew"` here, add `tap = "radotsvetkov/homebrew-memora"`
# and `publish-jobs = ["homebrew"]`, set a fine-grained `HOMEBREW_TAP_TOKEN`
# secret (contents:write on the tap), and run `dist generate`.
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

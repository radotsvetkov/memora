name: Python wrapper

on:
  push:
    paths:
      - "bindings/python/**"
      - ".github/workflows/python.yml"
    tags:
      - "python-v*"
  pull_request:
    paths:
      - "bindings/python/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev deps)
        run: pip install -e ".[dev]"
      # The wrapper's tests mock the subprocess, so they need no `memora` binary.
      - name: Test
        run: pytest -q

  # Publishes to PyPI via Trusted Publishing (OIDC) — no stored token. Only
  # runs on a `python-vX.Y.Z` tag, after `test` passes. One-time setup required
  # on PyPI's side before the first tag: see bindings/python/README.md.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
